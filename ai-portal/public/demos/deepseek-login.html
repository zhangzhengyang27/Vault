<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek - 开放平台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background-color: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        position: relative;
      }

      /* 右上角图标 */
      .top-right-icon {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 28px;
        height: 28px;
        background: #10b981;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        font-weight: bold;
      }

      .container {
        width: 100%;
        max-width: 950px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        display: flex;
      }

      .left-section {
        flex: 1;
        padding: 60px 50px;
      }

      .right-section {
        width: 300px;
        background: #fafafa;
        padding: 60px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-left: 1px solid #e5e5e5;
      }

      .logo-section {
        text-align: center;
        margin-bottom: 50px;
      }

      .logo {
        font-size: 36px;
        font-weight: 600;
        color: #000;
        display: inline-block;
        margin-right: 12px;
      }

      .badge {
        display: inline-block;
        background: #000;
        color: white;
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        vertical-align: middle;
      }

      .tabs {
        display: flex;
        gap: 30px;
        margin-bottom: 30px;
        border-bottom: 1px solid #e5e5e5;
      }

      .tab {
        padding: 10px 0;
        cursor: pointer;
        color: #999;
        font-size: 15px;
        position: relative;
        transition: color 0.3s;
      }

      .tab.active {
        color: #000;
        font-weight: 500;
      }

      .tab.active::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: #000;
      }

      .tab:hover {
        color: #000;
      }

      .description {
        color: #999;
        font-size: 13px;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        padding: 12px 16px;
        transition: border-color 0.3s;
      }

      .input-wrapper:focus-within {
        border-color: #000;
      }

      .country-code {
        color: #000;
        font-size: 14px;
        margin-right: 8px;
        padding-right: 8px;
        border-right: 1px solid #d9d9d9;
      }

      .phone-icon {
        color: #999;
        margin-right: 8px;
      }

      input {
        border: none;
        outline: none;
        flex: 1;
        font-size: 14px;
        color: #000;
      }

      input::placeholder {
        color: #bbb;
      }

      .verification-group {
        display: flex;
        gap: 12px;
      }

      .verification-input {
        flex: 1;
      }

      .send-code-btn {
        background: white;
        border: 1px solid #d9d9d9;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        color: #000;
        white-space: nowrap;
        transition: all 0.3s;
      }

      .send-code-btn:hover {
        border-color: #000;
      }

      .terms {
        font-size: 12px;
        color: #999;
        margin-bottom: 25px;
        line-height: 1.6;
      }

      .terms a {
        color: #000;
        text-decoration: none;
      }

      .terms a:hover {
        text-decoration: underline;
      }

      .login-btn {
        width: 100%;
        background: #000;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.3s;
      }

      .login-btn:hover {
        background: #333;
      }

      .qr-code-container {
        text-align: center;
      }

      .qr-code {
        width: 200px;
        height: 200px;
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .qr-placeholder {
        width: 180px;
        height: 180px;
        position: relative;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 加载动画 */
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #f0f0f0;
        border-top: 3px solid #999;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* 二维码图案 */
      .qr-pattern {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        grid-template-rows: repeat(9, 1fr);
        gap: 2px;
        padding: 10px;
      }

      .qr-block {
        background: #000;
        border-radius: 1px;
      }

      .qr-block.white {
        background: transparent;
      }

      .wechat-text {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: #52c41a;
        font-size: 14px;
      }

      .wechat-icon {
        width: 20px;
        height: 20px;
        color: #52c41a;
      }

      .footer {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        color: #999;
        font-size: 12px;
      }

      .footer a {
        color: #999;
        text-decoration: none;
        margin: 0 8px;
      }

      .footer a:hover {
        color: #000;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }

        .right-section {
          width: 100%;
          border-left: none;
          border-top: 1px solid #e5e5e5;
        }

        .left-section {
          padding: 40px 30px;
        }

        .right-section {
          padding: 40px 30px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 右上角图标 -->
    <div class="top-right-icon">f</div>

    <!-- 主容器 -->
    <div class="container">
      <!-- 左侧登录表单 -->
      <div class="left-section">
        <!-- Logo -->
        <div class="logo-section">
          <span class="logo">deepseek</span>
          <span class="badge">开放平台</span>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
          <div class="tab active">验证码登录</div>
          <div class="tab">密码登录</div>
        </div>

        <!-- 描述 -->
        <div class="description">你所在地区仅支持 手机号 / 微信 / 邮箱 登录</div>

        <!-- 手机号输入 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="phone-icon">📱</span>
            <span class="country-code">+86</span>
            <input type="tel" placeholder="请输入手机号" />
          </div>
        </div>

        <!-- 验证码输入 -->
        <div class="form-group verification-group">
          <div class="input-wrapper verification-input">
            <span style="color: #999; margin-right: 8px">#</span>
            <input type="text" placeholder="请输入验证码" />
          </div>
          <button class="send-code-btn">发送验证码</button>
        </div>

        <!-- 用户协议 -->
        <div class="terms">注册登录即代表同意我们的<a href="#">开放平台协议</a>和<a href="#">隐私政策</a>。未注册的手机号将自动注册</div>

        <!-- 登录按钮 -->
        <button class="login-btn">登录</button>
      </div>

      <!-- 右侧二维码 -->
      <div class="right-section">
        <div class="qr-code-container">
          <div class="qr-code">
            <div class="qr-placeholder">
              <div class="loading-spinner"></div>
            </div>
          </div>
          <div class="wechat-text">
            <svg class="wechat-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M9.5 4C5.4 4 2 6.6 2 9.8c0 1.8 1 3.4 2.5 4.5v2.2l2.8-1.4c.8.2 1.7.3 2.7.3 4.1 0 7.5-2.6 7.5-5.8S13.6 4 9.5 4zm-1.2 7.8l-1.6-1.6-3 1.6 3.2-3.5 1.6 1.6 3-1.6-3.2 3.5z" />
            </svg>
            微信扫码登录
          </div>
        </div>
      </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">浙ICP备2023025841号 · <a href="#">联系我们</a></div>

    <script>
      // 标签页切换
      const tabs = document.querySelectorAll(".tab")
      tabs.forEach((tab) => {
        tab.addEventListener("click", function () {
          tabs.forEach((t) => t.classList.remove("active"))
          this.classList.add("active")
        })
      })

      // 发送验证码按钮
      const sendCodeBtn = document.querySelector(".send-code-btn")
      sendCodeBtn.addEventListener("click", function () {
        let countdown = 60
        this.disabled = true
        this.style.color = "#999"

        const timer = setInterval(() => {
          countdown--
          this.textContent = `${countdown}秒后重发`

          if (countdown <= 0) {
            clearInterval(timer)
            this.textContent = "发送验证码"
            this.disabled = false
            this.style.color = "#000"
          }
        }, 1000)
      })

      // 登录按钮
      const loginBtn = document.querySelector(".login-btn")
      loginBtn.addEventListener("click", function () {
        const phone = document.querySelector('input[type="tel"]').value
        const code = document.querySelector('input[type="text"]').value

        if (!phone) {
          alert("请输入手机号")
          return
        }

        if (!code) {
          alert("请输入验证码")
          return
        }

        // 这里添加登录逻辑
        console.log("登录", { phone, code })
        alert("登录功能演示")
      })
    </script>
  </body>
</html>
