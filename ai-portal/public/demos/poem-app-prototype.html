<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>古诗词应用原型展示</title>
    <style>
      :root {
        --bg-color: #f9f7f2; /* 宣纸白 */
        --primary-color: #8b5a2b; /* 泥金/棕褐 */
        --accent-color: #c0392b; /* 朱砂红 */
        --text-main: #2c2c2c; /* 浓墨 */
        --text-sub: #666666; /* 淡墨 */
        --border-color: #e0ddd5;
        --card-shadow: 0 4px 12px rgba(139, 90, 43, 0.08);
        --safe-area-top: 44px;
        --safe-area-bottom: 34px;
        --nav-height: 44px;
        --tab-bar-height: 83px; /* 49 + 34 */
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 40px;
        font-family: "PingFang SC", "Hiragino Sans GB", "Songti SC", "SimSun", serif;
        background-color: #e0e0e0;
        min-height: 100vh;
        overflow: auto;
      }

      .showcase-container {
        display: flex;
        gap: 60px;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        padding-bottom: 40px;
      }

      .frame-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .frame-title {
        font-size: 18px;
        font-weight: bold;
        color: #333;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* 模拟 iPhone 外壳 */
      .iphone-frame {
        width: 390px;
        height: 844px;
        background-color: var(--bg-color);
        border-radius: 40px;
        position: relative;
        overflow: hidden;
        box-shadow:
          0 0 0 12px #333,
          0 0 0 14px #555,
          0 20px 50px rgba(0, 0, 0, 0.5);
        flex-shrink: 0;
      }

      /* 状态栏 */
      .status-bar {
        height: var(--safe-area-top);
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
        padding-top: 10px;
      }

      /* 灵动岛/刘海 */
      .notch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 35px;
        background-color: #000;
        border-radius: 18px;
        z-index: 101;
      }

      /* 导航栏 */
      .nav-bar {
        height: var(--nav-height);
        width: 100%;
        position: absolute;
        top: var(--safe-area-top);
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(249, 247, 242, 0.9);
        backdrop-filter: blur(10px);
        z-index: 90;
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
      }

      .nav-title {
        font-size: 17px;
        font-weight: 600;
        color: var(--text-main);
      }

      .nav-left {
        position: absolute;
        left: 16px;
        height: 100%;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      /* 页面容器 */
      .page-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .page {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding-top: calc(var(--safe-area-top) + var(--nav-height));
        padding-bottom: var(--tab-bar-height);
        overflow-y: auto;
        background-color: var(--bg-color);
        display: block; /* 强制显示 */
      }

      /* 隐藏滚动条 */
      .page::-webkit-scrollbar {
        display: none;
      }

      /* 底部标签栏 */
      .tab-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--tab-bar-height);
        background-color: rgba(249, 247, 242, 0.95);
        border-top: 0.5px solid rgba(0, 0, 0, 0.1);
        display: flex;
        padding-bottom: 20px; /* 适配 Home Indicator */
        z-index: 90;
      }

      .tab-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #999;
        cursor: pointer;
      }

      .tab-item.active {
        color: var(--primary-color);
      }

      .tab-icon {
        width: 24px;
        height: 24px;
        margin-bottom: 4px;
        fill: currentColor;
      }

      .tab-text {
        font-size: 10px;
        font-weight: 500;
      }

      /* Home Indicator */
      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        background-color: #000;
        border-radius: 2.5px;
        z-index: 102;
      }

      /* ================== 组件样式 ================== */

      /* 按钮 */
      .btn {
        background-color: var(--primary-color);
        color: #fff;
        border: none;
        border-radius: 24px;
        padding: 14px 24px;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(139, 90, 43, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-outline {
        background-color: transparent;
        border: 1px solid var(--primary-color);
        color: var(--primary-color);
        box-shadow: none;
      }

      /* 输入框 */
      .input-group {
        background-color: #fff;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 24px;
        box-shadow: var(--card-shadow);
        border: 1px solid rgba(0, 0, 0, 0.03);
      }

      .text-input {
        width: 100%;
        border: none;
        outline: none;
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-main);
        background: transparent;
        resize: none;
        min-height: 120px;
        font-family: inherit;
      }

      .text-input::placeholder {
        color: #ccc;
      }

      /* 卡片 */
      .card {
        background-color: #fff;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: var(--card-shadow);
      }

      /* 列表项 */
      .list-item {
        background-color: #fff;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        display: flex;
        gap: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        position: relative;
        overflow: hidden;
      }

      .list-img {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        object-fit: cover;
        background-color: #eee;
      }

      .list-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .list-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 4px;
      }

      .list-desc {
        font-size: 13px;
        color: var(--text-sub);
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .list-action-btn {
        padding: 8px;
        color: #999;
        display: flex;
        align-items: center;
      }

      /* ================== 页面特定样式 ================== */

      /* 首页 */
      .content-padding {
        padding: 24px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .welcome-text {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text-main);
      }

      .sub-text {
        font-size: 14px;
        color: var(--text-sub);
        margin-bottom: 32px;
      }

      /* 详情页 */
      #detail-page-content {
        padding-bottom: calc(var(--safe-area-bottom) + 80px);
        background-color: var(--bg-color);
      }

      .hero-image {
        width: 100%;
        height: 300px;
        object-fit: cover;
        mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
      }

      .detail-content {
        padding: 0 24px;
        margin-top: -40px;
        position: relative;
      }

      .poem-card {
        background-color: #fff;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        text-align: center;
        margin-bottom: 24px;
        position: relative;
      }

      .poem-card::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        border: 1px solid var(--primary-color);
        border-radius: 12px;
        opacity: 0.3;
        pointer-events: none;
      }

      .poem-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .poem-title {
        font-size: 22px;
        font-weight: bold;
        font-family: "Songti SC", serif;
        margin-bottom: 0;
      }

      .poem-meta {
        font-size: 14px;
        color: var(--text-sub);
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .dynasty-tag {
        background-color: rgba(139, 90, 43, 0.1);
        color: var(--primary-color);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }

      .poem-lines {
        font-size: 18px;
        line-height: 1.8;
        color: var(--text-main);
        margin-bottom: 16px;
        font-family: "Songti SC", serif;
      }

      /* 播放器 */
      .audio-player {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #f8f8f8;
        padding: 4px 12px;
        border-radius: 20px;
        width: fit-content;
        margin: 0;
        height: 32px;
        cursor: pointer;
      }

      .play-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background-color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .audio-wave {
        height: 14px;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .bar {
        width: 2px;
        background-color: #ccc;
        border-radius: 1px;
        animation: wave 1s infinite ease-in-out;
        animation-play-state: paused;
      }

      .bar:nth-child(odd) {
        height: 60%;
      }
      .bar:nth-child(even) {
        height: 100%;
      }
      .bar:nth-child(1) {
        animation-delay: 0s;
      }
      .bar:nth-child(2) {
        animation-delay: 0.1s;
      }
      .bar:nth-child(3) {
        animation-delay: 0.2s;
      }
      .bar:nth-child(4) {
        animation-delay: 0.3s;
      }
      .bar:nth-child(5) {
        animation-delay: 0.4s;
      }

      .audio-player.playing .bar {
        background-color: var(--primary-color);
        animation-play-state: running;
      }

      @keyframes wave {
        0%,
        100% {
          transform: scaleY(0.5);
        }
        50% {
          transform: scaleY(1);
        }
      }

      .section-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 12px;
        border-left: 4px solid var(--primary-color);
        padding-left: 10px;
      }

      .desc-text {
        font-size: 15px;
        line-height: 1.6;
        color: #444;
        text-align: justify;
      }

      .detail-actions {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 10px 24px calc(var(--safe-area-bottom) + 4px);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        gap: 16px;
        z-index: 100;
      }

      .detail-actions .btn {
        padding: 10px 20px;
        font-size: 15px;
      }

      /* 收藏页 */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 300px;
        color: #999;
        text-align: center;
      }

      .empty-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="showcase-container">
      <!-- Frame 1: 首页 -->
      <div class="frame-wrapper">
        <div class="frame-title">首页</div>
        <div class="iphone-frame">
          <div class="notch"></div>
          <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 6px">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                <path
                  d="M16 4h-3c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 4H1C.45 4 0 4.45 0 5v2c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1zm6 0H7c-.55 0-1 .45-1 1v2c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1z" />
              </svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                <path
                  d="M14 0H2C.9 0 0 .9 0 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V2c0-1.1-.9-2-2-2zM2 10V2h12v8H2z" />
              </svg>
            </div>
          </div>

          <div class="nav-bar">
            <div class="nav-title">古诗雅集</div>
          </div>

          <div class="page-container">
            <div class="page">
              <div class="content-padding">
                <div class="welcome-text">寻章摘句</div>
                <div class="sub-text">输入关键词，AI 为您生成精美古诗解析</div>

                <div class="input-group">
                  <textarea
                    class="text-input"
                    placeholder="请输入古诗名称、作者或意象...&#10;例如：李白 静夜思"></textarea>
                </div>

                <button class="btn">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">
                    <path
                      d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                  </svg>
                  生成古诗详解
                </button>

                <div style="margin-top: 40px">
                  <div class="section-title" style="border: none; padding: 0">
                    推荐赏析
                  </div>
                  <div class="list-item">
                    <img
                      src="https://s.coze.cn/t/6GuwOb3-hk4/"
                      class="list-img"
                      alt="静夜思" />
                    <div class="list-content">
                      <div class="list-title">静夜思</div>
                      <div class="list-desc">李白 · 唐代</div>
                    </div>
                    <div class="list-action-btn">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#ccc"
                        stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                      </svg>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="tab-bar">
            <div class="tab-item active">
              <svg class="tab-icon" viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span class="tab-text">首页</span>
            </div>
            <div class="tab-item">
              <svg class="tab-icon" viewBox="0 0 24 24">
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span class="tab-text">我的收藏</span>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>

      <!-- Frame 2: 详情页 -->
      <div class="frame-wrapper">
        <div class="frame-title">详情页</div>
        <div class="iphone-frame">
          <div class="notch"></div>
          <div class="status-bar">
            <span>9:42</span>
            <div style="display: flex; gap: 6px">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                <path
                  d="M16 4h-3c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 4H1C.45 4 0 4.45 0 5v2c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1zm6 0H7c-.55 0-1 .45-1 1v2c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1z" />
              </svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                <path
                  d="M14 0H2C.9 0 0 .9 0 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V2c0-1.1-.9-2-2-2zM2 10V2h12v8H2z" />
              </svg>
            </div>
          </div>

          <div class="nav-bar">
            <div class="nav-left">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </div>
            <div class="nav-title">古诗详情</div>
          </div>

          <div class="page-container">
            <div class="page" id="detail-page-content">
              <img
                src="https://s.coze.cn/t/6GuwOb3-hk4/"
                class="hero-image"
                alt="古诗配图" />
              <div class="detail-content">
                <div class="poem-card">
                  <div class="poem-header">
                    <div class="poem-title">静夜思</div>
                    <div
                      class="audio-player"
                      id="demo-audio-player"
                      onclick="toggleAudio()">
                      <div class="play-btn">
                        <svg
                          id="icon-play"
                          width="10"
                          height="10"
                          viewBox="0 0 24 24"
                          fill="currentColor">
                          <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <svg
                          id="icon-pause"
                          style="display: none"
                          width="10"
                          height="10"
                          viewBox="0 0 24 24"
                          fill="currentColor">
                          <rect x="6" y="4" width="4" height="16"></rect>
                          <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                      </div>
                      <div class="audio-wave">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                      </div>
                      <span style="font-size: 11px; color: #666">11s</span>
                    </div>
                  </div>

                  <div class="poem-meta">
                    <span class="dynasty-tag">唐</span>
                    <span>李白</span>
                  </div>
                  <div class="poem-lines">
                    床前明月光，疑是地上霜。<br />
                    举头望明月，低头思故乡。
                  </div>
                </div>

                <div class="card">
                  <div class="section-title">诗意赏析</div>
                  <div class="desc-text">
                    明亮月光洒在床前，诗人起初以为是地上结霜。他抬头望向明月，不禁低头陷入对故乡的思念。此诗创作于李白客居他乡之时，真切表达出他的思乡之情。
                  </div>
                </div>
              </div>

              <div class="detail-actions">
                <button class="btn btn-outline" style="flex: 1">返回</button>
                <button class="btn" style="flex: 2">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">
                    <path
                      d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                  </svg>
                  <span>收藏古诗</span>
                </button>
              </div>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>

      <!-- Frame 3: 收藏页 -->
      <div class="frame-wrapper">
        <div class="frame-title">收藏页</div>
        <div class="iphone-frame">
          <div class="notch"></div>
          <div class="status-bar">
            <span>9:45</span>
            <div style="display: flex; gap: 6px">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                <path

    <script>
      // 仅保留详情页的音频播放功能演示
      let isPlaying = false
      let audioObj = new Audio(
        "https://lf26-appstore-sign.oceancloudapi.com/ocean-cloud-tos/VolcanoUserVoice/speech_7468518753626505253_723e6798-3441-4ef7-81a7-0ae3f33be99d.mp3?lk3s=da27ec82&x-expires=1770278185&x-signature=re%2BSOS%2FEd8diulIb6ZhU%2Fa%2B3g8s%3D"
      )

      audioObj.addEventListener("ended", () => {
        isPlaying = false
        updateAudioUI()
      })

      function toggleAudio() {
        if (isPlaying) {
          audioObj.pause()
        } else {
          audioObj.play()
        }
        isPlaying = !isPlaying
        updateAudioUI()
      }

      function updateAudioUI() {
        const player = document.getElementById("demo-audio-player")
        const playIcon = document.getElementById("icon-play")
        const pauseIcon = document.getElementById("icon-pause")

        if (isPlaying) {
          player.classList.add("playing")
          playIcon.style.display = "none"
          pauseIcon.style.display = "block"
        } else {
          player.classList.remove("playing")
          playIcon.style.display = "block"
          pauseIcon.style.display = "none"
        }
      }
    </script>
