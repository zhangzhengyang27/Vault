<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消费账单分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            font-size: 24px;
            color: #1565c0;
            text-align: center;
            margin-bottom: 24px;
        }
        .upload-area {
            background: #fff;
            border: 2px dashed #90caf9;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 24px;
        }
        .upload-area:hover { border-color: #1976d2; }
        .upload-area p { color: #78909c; font-size: 16px; }
        .upload-area .icon { font-size: 40px; margin-bottom: 10px; }
        .total-card {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            color: #fff;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }
        .total-card .amount { font-size: 36px; font-weight: 700; }
        .total-card .label { font-size: 14px; opacity: 0.8; margin-top: 4px; }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
        .chart-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .chart-card h3 {
            font-size: 16px;
            color: #37474f;
            margin-bottom: 12px;
        }
        .table-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .table-card h3 {
            font-size: 16px;
            color: #37474f;
            margin-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eceff1;
            font-size: 14px;
        }
        th { color: #78909c; font-weight: 600; }
        td { color: #37474f; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 消费账单分析</h1>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="icon">📁</div>
            <p>点击上传 CSV 文件（包含：日期、金额、分类、备注）</p>
            <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="handleFile(event)">
        </div>
        <div id="resultArea" class="hidden">
            <div class="total-card">
                <div class="label">总消费金额</div>
                <div class="amount" id="totalAmount">¥0.00</div>
            </div>
            <div class="charts">
                <div class="chart-card">
                    <h3>分类消费占比</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>分类金额对比</h3>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="table-card">
                <h3>分类明细</h3>
                <table>
                    <thead><tr><th>分类</th><th>总金额</th><th>占比</th><th>笔数</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        let pieChart = null, barChart = null;
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            Papa.parse(file, {
                header: true,
                complete: function(results) {
                    const data = results.data.filter(r => r['金额'] || r['金额 '] || r['amount']);
                    analyze(data);
                }
            });
        }
        function analyze(data) {
            const summary = {};
            let total = 0;
            data.forEach(row => {
                const cat = row['分类'] || row['分类 '] || row['category'] || '其他';
                const amt = parseFloat((row['金额'] || row['金额 '] || row['amount'] || '0').replace(/,/g, ''));
                if (isNaN(amt)) return;
                total += amt;
                if (!summary[cat]) summary[cat] = { amount: 0, count: 0 };
                summary[cat].amount += amt;
                summary[cat].count++;
            });
            document.getElementById('totalAmount').textContent = '¥' + total.toFixed(2);
            document.getElementById('resultArea').classList.remove('hidden');
            const labels = Object.keys(summary);
            const amounts = labels.map(l => summary[l].amount);
            const counts = labels.map(l => summary[l].count);
            const colors = ['#1976d2','#43a047','#fb8c00','#e53935','#8e24aa','#00acc1','#7cb342','#f4511e','#5e35b1','#039be5'];
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data: amounts, backgroundColor: colors.slice(0, labels.length) }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
            if (barChart) barChart.destroy();
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: '金额', data: amounts, backgroundColor: colors.slice(0, labels.length) }] },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            labels.sort((a, b) => summary[b].amount - summary[a].amount).forEach(cat => {
                const pct = ((summary[cat].amount / total) * 100).toFixed(1);
                tbody.innerHTML += `<tr><td>${cat}</td><td>¥${summary[cat].amount.toFixed(2)}</td><td>${pct}%</td><td>${summary[cat].count}</td></tr>`;
            });
        }
    </script>
</body>
</html>
