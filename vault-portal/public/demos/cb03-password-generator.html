<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #e4e9f0);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 22px;
            color: #1976d2;
            text-align: center;
            margin-bottom: 24px;
        }
        .password-display {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 16px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            text-align: center;
            word-break: break-all;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            border: 2px solid #e0e0e0;
        }
        .strength {
            text-align: center;
            margin-bottom: 20px;
        }
        .strength-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .strength-weak { background: #ffebee; color: #c62828; }
        .strength-medium { background: #fff3e0; color: #e65100; }
        .strength-strong { background: #e8f5e9; color: #2e7d32; }
        .strength-very-strong { background: #e8f5e9; color: #1b5e20; }
        .control-group {
            margin-bottom: 16px;
        }
        .control-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }
        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1976d2;
            cursor: pointer;
        }
        .length-val {
            font-size: 18px;
            font-weight: 700;
            color: #1976d2;
            min-width: 30px;
            text-align: center;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #444;
            cursor: pointer;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1976d2;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-generate {
            background: #1976d2;
            color: #fff;
        }
        .btn-copy {
            background: #43a047;
            color: #fff;
        }
        .toast {
            display: none;
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="toast" id="toast">已复制到剪贴板</div>
    <div class="card">
        <h1>🔑 随机密码生成器</h1>
        <div class="password-display" id="passwordDisplay">点击下方按钮生成密码</div>
        <div class="strength" id="strengthWrap" style="display:none;">
            <span class="strength-badge" id="strengthBadge">弱</span>
        </div>
        <div class="control-group">
            <label>密码长度</label>
            <div class="slider-wrap">
                <input type="range" id="lengthSlider" min="8" max="32" value="16" oninput="updateLength()">
                <span class="length-val" id="lengthVal">16</span>
            </div>
        </div>
        <div class="control-group">
            <label>包含字符类型</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" id="upper" checked> 大写字母</label>
                <label class="checkbox-item"><input type="checkbox" id="lower" checked> 小写字母</label>
                <label class="checkbox-item"><input type="checkbox" id="digits" checked> 数字</label>
                <label class="checkbox-item"><input type="checkbox" id="symbols" checked> 特殊符号</label>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-generate" onclick="generatePassword()">生成密码</button>
            <button class="btn btn-copy" onclick="copyPassword()">复制密码</button>
        </div>
    </div>
    <script>
        function updateLength() {
            document.getElementById('lengthVal').textContent = document.getElementById('lengthSlider').value;
        }
        function generatePassword() {
            const len = parseInt(document.getElementById('lengthSlider').value);
            const useUpper = document.getElementById('upper').checked;
            const useLower = document.getElementById('lower').checked;
            const useDigits = document.getElementById('digits').checked;
            const useSymbols = document.getElementById('symbols').checked;
            let chars = '';
            if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useDigits) chars += '0123456789';
            if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            if (!chars) { chars = 'abcdefghijklmnopqrstuvwxyz'; }
            let password = '';
            for (let i = 0; i < len; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passwordDisplay').textContent = password;
            updateStrength(password);
        }
        function updateStrength(pwd) {
            const wrap = document.getElementById('strengthWrap');
            const badge = document.getElementById('strengthBadge');
            wrap.style.display = 'block';
            let score = 0;
            if (pwd.length >= 12) score++;
            if (pwd.length >= 16) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[a-z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;
            if (score <= 2) { badge.textContent = '弱'; badge.className = 'strength-badge strength-weak'; }
            else if (score <= 3) { badge.textContent = '中'; badge.className = 'strength-badge strength-medium'; }
            else if (score <= 4) { badge.textContent = '强'; badge.className = 'strength-badge strength-strong'; }
            else { badge.textContent = '极强'; badge.className = 'strength-badge strength-very-strong'; }
        }
        function copyPassword() {
            const pwd = document.getElementById('passwordDisplay').textContent;
            if (pwd === '点击下方按钮生成密码') return;
            navigator.clipboard.writeText(pwd).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 1500);
            }).catch(() => {
                // fallback for non-HTTPS
                const ta = document.createElement('textarea');
                ta.value = pwd;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 1500);
            });
        }
        generatePassword();
    </script>
</body>
</html>
