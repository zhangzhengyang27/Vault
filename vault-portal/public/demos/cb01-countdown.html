<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #2d6a9f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .date-input-wrap {
            margin-bottom: 40px;
        }
        .date-input-wrap label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            opacity: 0.8;
        }
        input[type="date"] {
            padding: 12px 24px;
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        input[type="date"]:focus {
            border-color: #4fc3f7;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .countdown-item {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px 20px;
            min-width: 120px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .countdown-item .number {
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
            color: #4fc3f7;
            text-shadow: 0 0 20px rgba(79,195,247,0.5);
        }
        .countdown-item .number.days {
            color: #ff5252;
            text-shadow: 0 0 20px rgba(255,82,82,0.5);
        }
        .countdown-item .label {
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.7;
            letter-spacing: 1px;
        }
        .message {
            margin-top: 30px;
            font-size: 18px;
            opacity: 0.6;
        }
        .expired {
            color: #ff5252;
            font-size: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏳ 倒计时工具</h1>
        <div class="date-input-wrap">
            <label>选择目标日期</label>
            <input type="date" id="targetDate" onchange="startCountdown()">
        </div>
        <div class="countdown" id="countdown" style="display:none;">
            <div class="countdown-item">
                <div class="number days" id="days">0</div>
                <div class="label">天</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="hours">0</div>
                <div class="label">小时</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="minutes">0</div>
                <div class="label">分钟</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="seconds">0</div>
                <div class="label">秒</div>
            </div>
        </div>
        <div class="message" id="message"></div>
    </div>
    <script>
        let timer = null;
        function startCountdown() {
            const input = document.getElementById('targetDate');
            if (!input.value) return;
            const target = new Date(input.value + 'T00:00:00');
            const now = new Date();
            if (target <= now) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('message').innerHTML = '<span class="expired">该日期已过去</span>';
                return;
            }
            document.getElementById('countdown').style.display = 'flex';
            document.getElementById('message').textContent = '';
            if (timer) clearInterval(timer);
            update(target);
            timer = setInterval(() => update(target), 1000);
        }
        function update(target) {
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) {
                clearInterval(timer);
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('message').innerHTML = '<span class="expired">时间到！</span>';
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('days').textContent = d;
            document.getElementById('hours').textContent = String(h).padStart(2, '0');
            document.getElementById('minutes').textContent = String(m).padStart(2, '0');
            document.getElementById('seconds').textContent = String(s).padStart(2, '0');
        }
    </script>
</body>
</html>
