const SEC_ALL = {"model": 13, "product": 11, "industry": 7, "paper": 5, "tips": 12};

  // 把 API 返回内容视为不可信，渲染前做 HTML 转义
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // 仅允许 http/https 链接，避免 javascript: 等注入
  function sanitizeUrl(u) {
    return /^https?:\/\//i.test(u) ? u : "#";
  }

  (function render() {
    const counts = {};
    SECTIONS.forEach(function (s) { counts[s.id] = 0; });
    ITEMS.forEach(function (it) { if (counts[it.section] != null) counts[it.section]++; });
    const total = ITEMS.length;

    document.getElementById("hero-date").textContent = REPORT_RANGE;
    document.getElementById("hero-total").textContent = total;
    document.getElementById("foot-total").textContent = total;

    document.getElementById("hero-stats").innerHTML = SECTIONS.map(function (s) {
      return '<div class="stat"><div class="n">' + counts[s.id] + '</div><div class="l">' + escapeHtml(s.name) + '</div></div>';
    }).join("");

    document.getElementById("toc").innerHTML = SECTIONS.map(function (s) {
      const zero = counts[s.id] === 0 ? " zero" : "";
      return '<a class="' + zero + '" href="#sec-' + s.id + '">' + s.icon + ' ' + escapeHtml(s.name) + '<span class="pill">' + counts[s.id] + '</span></a>';
    }).join("");

    let globalSeq = 0;
    document.getElementById("sections").innerHTML = SECTIONS.map(function (s) {
      const items = ITEMS.filter(function (it) { return it.section === s.id; });
      const all = (typeof SEC_ALL !== "undefined" && SEC_ALL[s.id]) || 0;
      const truncated = all > items.length;
      const moreNote = truncated ? ' <span class="more">近7天共 ' + all + ' 条</span>' : '';
      const body = items.length
        ? '<div class="grid">' + items.map(function (it) {
            globalSeq++;
            const url = sanitizeUrl(it.url);
            return (
              '<article class="card">' +
                '<span class="idx">' + globalSeq + '</span>' +
                '<div class="meta">' +
                  '<span class="chip">' + escapeHtml(it.source) + '</span>' +
                  '<span class="time">🕒 ' + escapeHtml(it.time) + '</span>' +
                '</div>' +
                '<h3><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(it.title) + '</a></h3>' +
                '<p class="summary">' + escapeHtml(it.summary) + '</p>' +
                '<a class="read" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>' +
              '</article>'
            );
          }).join("") + '</div>'
        : '<div class="empty"><div class="big">该版块暂无 AI HOT 精选收录</div></div>';
      return (
        '<section class="block" id="sec-' + s.id + '">' +
          '<div class="sec-head">' +
            '<span class="ico">' + s.icon + '</span>' +
            '<h2>' + escapeHtml(s.name) + '</h2>' +
            '<span class="cnt">' + items.length + ' 条' + moreNote + '</span>' +
            '<span class="rule"></span>' +
          '</div>' +
          body +
        '</section>'
      );
    }).join("");
  })();
</script>
